map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name localhost PrimeMotors PrimeMotors.local;

    # Redirecionamento automático de HTTP (porta 80) para HTTPS (porta 443)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost PrimeMotors PrimeMotors.local;

    # Certificados SSL locais
    ssl_certificate /etc/nginx/ssl/PrimeMotors.crt;
    ssl_certificate_key /etc/nginx/ssl/PrimeMotors.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeçalhos Básicos de Segurança (Critério da Rubrica)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://code.jquery.com https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://PrimeMotors.local https://localhost http://localhost:* http://127.0.0.1:* wss://PrimeMotors.local https://api.cloudinary.com; frame-src https://www.youtube.com https://youtube.com; frame-ancestors 'self'; base-uri 'self';" always;

    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Roteamento do Frontend Estático
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # Proxy Reverso para as rotas da API no Backend
    location ~* ^/(auth|users|garage|favorites|cars|test-drives)(/|$) {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        # Cabeçalhos de repasse HTTP e WebSocket encaminhados corretamente
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Authorization $http_authorization;
        
        # Ajustes de buffer para evitar quebra em respostas longas de JSON
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}